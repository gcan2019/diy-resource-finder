name: Otonom Görsel Araştırma Ajanı (Akıllı Bulut Nöbetçisi)

on:
  schedule:
    # Her 2 saatte bir bulutta uyanır ve kontrol eder
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-autonomous-agent:
    runs-on: ubuntu-latest

    steps:
      - name: "Repoyu Klonla"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "Python 3.11 Kur"
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: "PC Acik mi Kontrol Et"
        id: check-pc
        run: |
          python check_pc_active.py

      - name: "Bagimliliklari Yukle"
        if: steps.check-pc.outputs.should_run == 'true'
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: "Nobeti Devral - Bulutta Taramayi Calistir"
        if: steps.check-pc.outputs.should_run == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          echo "🌙 PC kapali oldugu tespit edildi. Nobeti GitHub Bulut devraldi!"
          python autonomous_agent.py --rounds 10

      - name: "Bulut Kesiflerini Kaydet ve Commit Et"
        if: steps.check-pc.outputs.should_run == 'true'
        run: |
          git config --global user.name "Otonom Bulut Nobetcisi"
          git config --global user.email "actions@github.com"
          git add data/knowledge_base.json DISCOVERIES.md
          if git diff --staged --quiet; then
            echo "Yeni kesif yok, commit atlanıyor."
          else
            git commit -m "🌙 Bulut Nobetcisi: PC kapaliyken yeni kaynaklar bulundu [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
